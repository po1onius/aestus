<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">Token Gateway</title>
  <desc id="description">统一 API 端口经过中央 Token 门，路由到多个 Provider 节点。</desc>

  <!--
    端口线路先绘制、门体后绘制，让线路在视觉上自然穿入网关内部。
    左侧单节点代表统一 API，右侧扇出的三个节点代表可编排的 Provider 资源。
  -->
  <g fill="none" stroke-linecap="butt" stroke-linejoin="round">
    <path d="M6 32h11.5" stroke="#5B5BD6" stroke-width="3.5" />
    <path d="M46.5 23c4.5 0 5-7 11.5-7" stroke="#818CF8" stroke-width="3" />
    <path d="M46.5 32H58" stroke="#818CF8" stroke-width="3" />
    <path d="M46.5 41c4.5 0 5 7 11.5 7" stroke="#818CF8" stroke-width="3" />
  </g>

  <circle cx="6" cy="32" r="3.25" fill="#5B5BD6" />
  <g fill="#A5A6FF">
    <circle cx="58" cy="16" r="2.75" />
    <circle cx="58" cy="32" r="2.75" />
    <circle cx="58" cy="48" r="2.75" />
  </g>

  <!-- 双色门体以两条独立曲线围成收束空间，避免传统徽章式外框的厚重感。 -->
  <path
    d="M30.5 11.5C22.2 15 17.5 22.6 17.5 32s4.7 17 13 20.5"
    fill="none"
    stroke="#5B5BD6"
    stroke-linecap="round"
    stroke-width="5"
  />
  <path
    d="M33.5 11.5C41.8 15 46.5 22.6 46.5 32s-4.7 17-13 20.5"
    fill="none"
    stroke="#A5A6FF"
    stroke-linecap="round"
    stroke-width="5"
  />
  <!-- 顶部浅紫在上、底部深紫在上，微小的遮挡关系让两条路径真正产生编织感。 -->
  <path
    d="M27.4 50.7c1 .75 2 1.35 3.1 1.8"
    fill="none"
    stroke="#5B5BD6"
    stroke-linecap="round"
    stroke-width="5"
  />

  <!-- 镂空六边形是可计量、可流转的 Token，同时也是网关的稳定视觉锚点。 -->
  <path
    fill="#818CF8"
    fill-rule="evenodd"
    d="m32 21.75 9 5.15v10.2l-9 5.15-9-5.15V26.9l9-5.15Zm0 6-3.75 2.15v4.2L32 36.25l3.75-2.15v-4.2L32 27.75Z"
  />
</svg>
