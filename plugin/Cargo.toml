[workspace]
members = [
    "crates/common",
    "crates/request",
    "crates/buffered-response",
    "crates/stream-response",
    "crates/componentize",
    "crates/test-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.34"
mime_guess = "2.0.5"
multer = "3.1.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
wit-bindgen = "0.60.0"
wit-component = "0.254.0"

[profile.release]
codegen-units = 1
lto = true
# JSON 解析和序列化是插件热点；三个组件使用速度优化后也只有数百 KiB，优先减少
# 大型请求的转换延迟。
opt-level = 3
panic = "abort"
strip = true
