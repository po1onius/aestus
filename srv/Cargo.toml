[package]
name = "aestus"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.22.1"
bcrypt = "0.19.2"
bytes = "1.11.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clickhouse = { version = "0.15.1", features = ["chrono", "uuid"] }
diesel = { version = "2.3.10", features = ["postgres", "chrono", "uuid", "serde_json"] }
diesel-async = { version = "0.9.1", features = ["postgres", "deadpool"] }
email_address = "0.2.9"
hex = "0.4.3"
futures-util = "0.3.32"
http-body-util = "0.1.3"
hyper = { version = "1.10.1", features = ["http1", "server"] }
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto"] }
json-patch = "4.2.0"
lettre = { version = "0.11.22", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "pool"] }
logroller = "0.1.12"
mime_guess = "2.0.5"
multer = "3.1.0"
rand = "0.10.1"
redis = { version = "1.2.2", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "stream", "rustls", "cookies"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal"] }
tokio-util = { version = "0.7.17", features = ["io"] }
tower-http = { version = "0.6.11", features = ["cors", "trace", "request-id", "util", "fs"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.23.3", features = ["v7", "serde"] }
wasmtime = { version = "47.0.2", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
